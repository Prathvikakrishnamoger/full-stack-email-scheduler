services:
  - type: web
    name: email-scheduler-api
    runtime: node
    region: oregon
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && node src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: WORKER_CONCURRENCY
        value: 3
      - key: MAX_EMAILS_PER_HOUR
        value: 500
      - key: MAX_EMAILS_PER_HOUR_PER_SENDER
        value: 100
      - key: MIN_DELAY_BETWEEN_SENDS_MS
        value: 2000
      - key: SENDER_ACCOUNTS
        sync: false
